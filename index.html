<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bonded Store Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16233A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bonded Store">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233A;
    --ink-2:#233450;
    --paper:#F1E9D8;
    --paper-2:#FBF7EE;
    --line:#CBBFA3;
    --line-soft:#DED4BC;
    --stamp:#B23A2E;
    --stamp-dark:#8A2C22;
    --teal:#2F6E5B;
    --teal-dark:#20503F;
    --grey:#8B8378;
    --text:#241C13;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    overflow-x:hidden;
  }
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    display:flex;
    min-height:100vh;
    min-height:100dvh;
  }
  .sidebar{
    width:210px;
    flex-shrink:0;
    background:var(--ink);
    color:#E7E1D2;
    padding:24px 0;
    display:flex;
    flex-direction:column;
  }
  .brand{
    padding:0 20px 22px;
    border-bottom:1px solid #33456A;
    margin-bottom:14px;
  }
  .brand .stamp-mark{
    display:inline-block;
    font-family:'Special Elite',monospace;
    font-size:13px;
    letter-spacing:1px;
    border:2px solid #D9CFAE;
    color:#D9CFAE;
    padding:5px 9px;
    transform:rotate(-3deg);
    border-radius:3px;
  }
  .brand .brand-officer{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.3px;
    color:#8E9AB3;
    margin-top:7px;
    white-space:nowrap;
  }
  .brand h1{
    font-family:'Special Elite',monospace;
    font-size:17px;
    margin:12px 0 2px;
    letter-spacing:0.5px;
    line-height:1.3;
  }
  .brand p{
    margin:0;
    font-size:11px;
    color:#8E9AB3;
  }
  nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  nav button{
    all:unset;
    cursor:pointer;
    padding:11px 14px;
    border-radius:6px;
    font-size:14px;
    color:#C7CEDE;
    display:flex;
    align-items:center;
    gap:10px;
  }
  nav button:hover{background:#20304C;}
  nav button.active{background:var(--stamp);color:#fff;font-weight:600;}
  .nav-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    opacity:0.6;
    width:16px;
  }
  main{
    flex:1;
    padding:32px 40px 60px;
    max-width:960px;
  }
  h2.page-title{
    font-family:'Special Elite',monospace;
    font-size:22px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .page-sub{
    color:var(--grey);
    font-size:13px;
    margin:0 0 26px;
  }
  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px 22px;
    margin-bottom:20px;
  }
  .card h3{
    margin:0 0 14px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--grey);
    font-weight:600;
  }
  .crew-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:8px;
  }
  .crew-chip{
    all:unset;
    cursor:pointer;
    text-align:center;
    padding:12px 8px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    font-size:14px;
    font-weight:500;
    color:var(--ink-2);
  }
  .crew-chip:hover{border-color:var(--teal);}
  .crew-chip.selected{
    background:var(--teal);
    border-color:var(--teal-dark);
    color:#fff;
  }
  .cat-block{margin-bottom:16px;}
  .cat-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--stamp);
    margin-bottom:8px;
  }
  .item-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:10px;
  }
  .item-tile{
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    padding:10px 12px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item-tile .name{font-size:13.5px;font-weight:600;color:var(--ink-2);}
  .item-tile .price{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--grey);}
  .qty-row{display:flex;align-items:center;gap:8px;margin-top:2px;}
  .qty-btn{
    all:unset;
    cursor:pointer;
    width:30px;height:30px;
    border-radius:5px;
    background:var(--ink);
    color:#fff;
    text-align:center;
    line-height:30px;
    font-size:16px;
  }
  .qty-btn.minus{background:var(--grey);}
  .qty-val{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14px;
    min-width:18px;
    text-align:center;
  }
  .cart-panel{
    background:var(--ink);
    color:#E7E1D2;
    border-radius:8px;
    padding:18px 20px;
    position:sticky;
    top:20px;
  }
  .cart-panel h3{color:#8E9AB3;margin:0 0 12px;font-size:12px;letter-spacing:1px;text-transform:uppercase;}
  .cart-line{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:6px 0;
    border-bottom:1px solid #2A3B5C;
  }
  .cart-line .qty{color:#8E9AB3;font-family:'IBM Plex Mono',monospace;}
  .cart-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #33456A;
  }
  .cart-total .label{font-size:12px;color:#8E9AB3;text-transform:uppercase;letter-spacing:1px;}
  .cart-total .amt{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:#fff;}
  .btn{
    all:unset;
    cursor:pointer;
    display:inline-block;
    padding:12px 18px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    text-align:center;
  }
  .btn-stamp{background:var(--stamp);color:#fff;}
  .btn-stamp:hover{background:var(--stamp-dark);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover{background:var(--teal-dark);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink-2);}
  .btn-outline:hover{border-color:var(--ink-2);}
  .btn-block{width:100%;margin-top:14px;}
  .btn[disabled]{opacity:0.4;cursor:not-allowed;}
  .empty-note{color:#8E9AB3;font-size:12.5px;padding:8px 0;}
  input[type=text], input[type=number]{
    font-family:'Work Sans',sans-serif;
    font-size:16px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:5px;
    background:#fff;
    color:var(--text);
  }
  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.plain{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.plain th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--grey);
    padding:6px 8px;
    border-bottom:1px solid var(--line);
  }
  table.plain td{padding:8px;border-bottom:1px solid var(--line-soft);}
  table.plain tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{
    all:unset;cursor:pointer;color:var(--grey);font-size:12px;
    padding:5px 9px;border:1px solid var(--line);border-radius:4px;
  }
  .icon-btn:hover{color:var(--stamp);border-color:var(--stamp);}
  .add-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  .add-row input{flex:1;min-width:120px;}
  select{
    font-family:'Work Sans',sans-serif;
    font-size:16px;padding:9px 10px;
    border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--text);
  }
  .month-total{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
  }
  .grand-total-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--ink);
    color:#fff;
    border-radius:8px;
    padding:18px 22px;
    margin-bottom:20px;
  }
  .grand-total-card .label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8E9AB3;}
  .grand-total-card .amt{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}

  .receipt-overlay{
    position:fixed;inset:0;
    background:rgba(20,15,8,0.55);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow:auto;
    z-index:50;
  }
  .receipt-overlay.show{display:flex;}
  .receipt-slip{
    width:300px;
    background:#fff;
    font-family:'IBM Plex Mono',monospace;
    color:#1a1a1a;
    padding:22px 18px 26px;
    position:relative;
    box-shadow:0 12px 30px rgba(0,0,0,0.35);
  }
  .receipt-slip::after{
    content:"";
    position:absolute;
    left:0;right:0;bottom:-9px;height:18px;
    background-image:linear-gradient(135deg,#fff 50%,transparent 50%),linear-gradient(-135deg,#fff 50%,transparent 50%);
    background-size:16px 18px;
    background-repeat:repeat-x;
  }
  .r-center{text-align:center;}
  .r-stamp{
    display:inline-block;
    border:2px solid #1a1a1a;
    padding:3px 10px;
    font-family:'Special Elite',monospace;
    font-size:12px;
    letter-spacing:1px;
    transform:rotate(-2deg);
    margin-bottom:6px;
  }
  .r-sub{font-size:10.5px;color:#555;margin:0 0 12px;}
  .r-dash{border-top:1px dashed #999;margin:10px 0;}
  .r-row{display:flex;justify-content:space-between;font-size:12px;margin:3px 0;}
  .r-row.muted{color:#666;}
  .r-item-row{display:flex;justify-content:space-between;font-size:12px;margin:5px 0;}
  .r-item-name{flex:1;padding-right:8px;}
  .r-total-row{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-top:8px;}
  .r-foot{font-size:10px;color:#666;text-align:center;margin-top:14px;line-height:1.5;}
  .receipt-actions{
    display:flex;gap:10px;justify-content:center;margin-top:16px;
  }
  @media print{
    body *{visibility:hidden;}
    .receipt-slip, .receipt-slip *{visibility:visible;}
    .receipt-slip{position:absolute;top:0;left:0;box-shadow:none;}
    .receipt-actions{display:none;}
  }
  @media print{
    body.printing-report *{visibility:hidden;}
    body.printing-report #reportPrintArea, body.printing-report #reportPrintArea *{visibility:visible;}
    body.printing-report #reportPrintArea{position:absolute;top:0;left:0;width:100%;padding:0;border:none;background:#fff;}
    .no-print{display:none !important;}
    .table-wrap{overflow-x:visible !important;}
  }
  .crew-statement{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line-soft);}
  .crew-statement:last-child{border-bottom:none;margin-bottom:0;}
  .crew-statement-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .crew-statement-head h4{margin:0;font-size:14px;color:var(--ink-2);}
  .crew-statement-total{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .msg-empty{
    text-align:center;color:var(--grey);font-size:13px;padding:30px 10px;
  }
  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:14px;align-items:center;}
    .brand{border:none;padding:0 14px 0 0;margin:0;}
    .brand h1, .brand p{display:none;}
    nav{flex-direction:row;padding:0;}
    main{padding:20px 16px 50px;}
  }
  .sell-layout{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start;}
  @media (max-width:900px){.sell-layout{grid-template-columns:1fr;}}
  .crew-select{width:100%;max-width:320px;}
  .stock-input{width:78px;}
  .settings-note{margin:8px 0 0;flex-basis:100%;color:var(--grey);font-size:12.5px;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="stamp-mark">BONDED</span>
      <span class="brand-officer">3/O Jason Galorio</span>
      <h1>Crew Store Ledger</h1>
      <p>tally &middot; receipt &middot; deduct</p>
    </div>
    <nav id="nav">
      <button data-tab="sell" class="active"><span class="nav-num">01</span>Sell</button>
      <button data-tab="crew"><span class="nav-num">02</span>Crew</button>
      <button data-tab="items"><span class="nav-num">03</span>Items</button>
      <button data-tab="declare"><span class="nav-num">04</span>Declare</button>
      <button data-tab="reports"><span class="nav-num">05</span>Reports</button>
    </nav>
  </aside>

  <main id="main"></main>
</div>

<div class="receipt-overlay" id="receiptOverlay">
  <div>
    <div class="receipt-slip" id="receiptSlip"></div>
    <div class="receipt-actions">
      <button class="btn btn-outline" id="closeReceiptBtn">Close</button>
      <button class="btn btn-teal" id="printReceiptBtn">Print copy</button>
    </div>
  </div>
</div>

<script>
  // On-device storage shim (mirrors the Claude-artifact window.storage API)
  // so the rest of the app code doesn't need to know it's running standalone.
  window.storage = {
    get: function(key, shared){
      return new Promise(function(resolve, reject){
        try{
          var raw = localStorage.getItem(key);
          if(raw === null){ reject(new Error('not found')); return; }
          resolve({key: key, value: raw, shared: !!shared});
        }catch(e){ reject(e); }
      });
    },
    set: function(key, value, shared){
      return new Promise(function(resolve, reject){
        try{
          localStorage.setItem(key, value);
          resolve({key: key, value: value, shared: !!shared});
        }catch(e){ reject(e); }
      });
    },
    delete: function(key, shared){
      return new Promise(function(resolve, reject){
        try{
          localStorage.removeItem(key);
          resolve({key: key, deleted: true, shared: !!shared});
        }catch(e){ reject(e); }
      });
    },
    list: function(prefix, shared){
      return new Promise(function(resolve, reject){
        try{
          var keys = Object.keys(localStorage).filter(function(k){ return !prefix || k.indexOf(prefix) === 0; });
          resolve({keys: keys, prefix: prefix, shared: !!shared});
        }catch(e){ reject(e); }
      });
    }
  };
</script>

<script>
(function(){

  var state = {
    catalog: [],
    crew: [],
    monthTxns: {},
    declarations: {},
    cart: {},
    declareCart: {},
    selectedCrewId: null,
    declareCrewId: null,
    tab: 'sell',
    settings: {defaultCutoffDay: 1, periodCutoffs: {}},
    cutoffEditMonth: monthKey(new Date()),
    viewMonth: monthKey(new Date()),
    lastReceipt: null
  };

  function monthKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  // The cut-off day in effect for a given SOURCE calendar month (the month sales actually happen in).
  // Falls back to settings.defaultCutoffDay when that month has no explicit override.
  function getCutoffForMonth(mk){
    var override = state.settings.periodCutoffs && state.settings.periodCutoffs[mk];
    if(override != null) return override;
    return (state.settings && state.settings.defaultCutoffDay) || 1;
  }
  // Billing-period key: a sale rolls into next month's period once it's made after
  // that source month's own cut-off day. cutoff <= 1 means plain calendar-month behaviour.
  function periodKeyForDate(d){
    var mk0 = monthKey(d);
    var cutoff = getCutoffForMonth(mk0);
    if(cutoff <= 1) return mk0;
    if(d.getDate() > cutoff) return monthKey(new Date(d.getFullYear(), d.getMonth()+1, 1));
    return mk0;
  }
  // Human label for a period key, showing the actual date range it spans given
  // each contributing month's own cut-off (previous month's tail + this month's head).
  function periodLabel(mk){
    var parts = mk.split('-');
    var y = +parts[0], m = +parts[1]-1;
    var cutoffThis = getCutoffForMonth(mk);
    var prevDate = new Date(y, m-1, 1);
    var prevMk = monthKey(prevDate);
    var cutoffPrev = getCutoffForMonth(prevMk);
    if(cutoffThis <= 1 && cutoffPrev <= 1){
      return new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
    }
    var startDay = cutoffPrev <= 1 ? 1 : cutoffPrev+1;
    var startDate = new Date(prevDate.getFullYear(), prevDate.getMonth(), startDay);
    var endDate = cutoffThis <= 1 ? new Date(y, m+1, 0) : new Date(y, m, cutoffThis);
    return startDate.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' – ' + endDate.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  }
  function fmtMoney(n){
    return '$' + (Math.round(n*100)/100).toFixed(2);
  }
  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function todayStr(){
    var d = new Date();
    return d.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'});
  }
  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s == null ? '' : s;
    return div.innerHTML;
  }

  var DEFAULT_CATALOG = [
    {id:uid(), category:'Cigarettes', name:'Pack of cigarettes', price:5.00, openingStock:0},
    {id:uid(), category:'Soft Drinks', name:'Soft drink 330ml', price:1.00, openingStock:0},
    {id:uid(), category:'Chocolates', name:'Chocolate bar', price:1.50, openingStock:0},
    {id:uid(), category:'Chips', name:'Bag of chips', price:1.00, openingStock:0}
  ];

  async function storageGet(key, fallback, shared){
    try{
      var res = await window.storage.get(key, !!shared);
      if(!res) return fallback;
      return JSON.parse(res.value);
    }catch(e){
      return fallback;
    }
  }
  async function storageSet(key, value, shared){
    try{
      await window.storage.set(key, JSON.stringify(value), !!shared);
    }catch(e){
      console.error('storage set failed', key, e);
    }
  }

  async function loadAll(){
    state.catalog = await storageGet('catalog', null);
    if(!state.catalog){
      state.catalog = DEFAULT_CATALOG;
      await storageSet('catalog', state.catalog);
    }
    state.crew = await storageGet('crew', []);
    var rawSettings = await storageGet('settings', null);
    if(!rawSettings){
      state.settings = {defaultCutoffDay: 1, periodCutoffs: {}};
    }else{
      // migrate the old single-cutoffDay format if present
      state.settings = {
        defaultCutoffDay: rawSettings.defaultCutoffDay != null ? rawSettings.defaultCutoffDay : (rawSettings.cutoffDay != null ? rawSettings.cutoffDay : 1),
        periodCutoffs: rawSettings.periodCutoffs || {}
      };
      if(rawSettings.cutoffDay != null && rawSettings.defaultCutoffDay == null){
        await storageSet('settings', state.settings);
      }
    }
    state.cutoffEditMonth = monthKey(new Date());
    state.viewMonth = periodKeyForDate(new Date());
    state.monthTxns[state.viewMonth] = await storageGet('txns:' + state.viewMonth, []);
    state.declarations[state.viewMonth] = await storageGet('decl:' + state.viewMonth, []);
    render();
  }

  async function ensureMonthLoaded(mk){
    if(!state.monthTxns[mk]){
      state.monthTxns[mk] = await storageGet('txns:' + mk, []);
    }
  }
  async function ensureDeclarationsLoaded(mk){
    if(!state.declarations[mk]){
      state.declarations[mk] = await storageGet('decl:' + mk, []);
    }
  }

  function switchTab(tab){
    state.tab = tab;
    document.querySelectorAll('#nav button').forEach(function(b){
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    render();
  }

  document.getElementById('nav').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tab]');
    if(btn) switchTab(btn.dataset.tab);
  });

  function render(){
    var main = document.getElementById('main');
    if(state.tab === 'sell') main.innerHTML = renderSell();
    else if(state.tab === 'crew') main.innerHTML = renderCrew();
    else if(state.tab === 'items') main.innerHTML = renderItems();
    else if(state.tab === 'declare') main.innerHTML = renderDeclare();
    else if(state.tab === 'reports') main.innerHTML = renderReports();
    bindTabEvents();
  }

  function renderSell(){
    var crewOptions = '<option value="">— Select crew member —</option>' + state.crew.map(function(c){
      return '<option value="'+c.id+'"'+(state.selectedCrewId===c.id?' selected':'')+'>'+escapeHtml(c.name)+'</option>';
    }).join('');
    var crewChips = state.crew.length
      ? '<select id="crewSelect" class="crew-select">'+crewOptions+'</select>'
      : '<div class="empty-note">No crew added yet. Go to the Crew tab to add names.</div>';

    var cats = {};
    state.catalog.forEach(function(it){
      cats[it.category] = cats[it.category] || [];
      cats[it.category].push(it);
    });
    var catsHtml = Object.keys(cats).map(function(cat){
      var tiles = cats[cat].map(function(it){
        var qty = state.cart[it.id] || 0;
        return '<div class="item-tile">'+
          '<div class="name">'+escapeHtml(it.name)+'</div>'+
          '<div class="price">'+fmtMoney(it.price)+'</div>'+
          '<div class="qty-row">'+
            '<button class="qty-btn minus" data-minus="'+it.id+'">-</button>'+
            '<span class="qty-val">'+qty+'</span>'+
            '<button class="qty-btn" data-plus="'+it.id+'">+</button>'+
          '</div>'+
        '</div>';
      }).join('');
      return '<div class="cat-block"><div class="cat-label">'+escapeHtml(cat)+'</div><div class="item-grid">'+tiles+'</div></div>';
    }).join('');
    if(!state.catalog.length){
      catsHtml = '<div class="empty-note">No items in your catalog yet. Go to the Items tab to add stock.</div>';
    }

    var cartEntries = Object.keys(state.cart).filter(function(id){return state.cart[id]>0;});
    var cartLines = cartEntries.map(function(id){
      var it = state.catalog.find(function(x){return x.id===id;});
      if(!it) return '';
      return '<div class="cart-line"><span>'+escapeHtml(it.name)+'</span><span class="qty">x'+state.cart[id]+' &middot; '+fmtMoney(it.price*state.cart[id])+'</span></div>';
    }).join('');
    var total = cartEntries.reduce(function(sum,id){
      var it = state.catalog.find(function(x){return x.id===id;});
      return sum + (it ? it.price*state.cart[id] : 0);
    },0);

    var selectedCrew = state.crew.find(function(c){return c.id===state.selectedCrewId;});
    var canComplete = selectedCrew && cartEntries.length>0;

    var mk = periodKeyForDate(new Date());
    var todays = (state.monthTxns[mk] || []).filter(function(t){
      var d = new Date(t.dateISO);
      return d.toDateString() === new Date().toDateString();
    }).slice().reverse();

    var todayHtml = todays.length ? todays.map(function(t){
      return '<tr><td>'+escapeHtml(t.crewName)+'</td><td>'+t.items.length+' item(s)</td>'+
        '<td class="month-total">'+fmtMoney(t.total)+'</td>'+
        '<td class="row-actions"><button class="icon-btn" data-view-receipt="'+t.id+'">Receipt</button>'+
        '<button class="icon-btn" data-void="'+t.id+'">Void</button></td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty-note">No sales recorded yet today.</td></tr>';

    return ''+
    '<h2 class="page-title">Slopchest</h2>'+
    '<p class="page-sub">'+todayStr()+' — pick the crew member, tap what they take, then complete the sale.</p>'+
    '<div class="sell-layout">'+
      '<div>'+
        '<div class="card"><h3>Crew member</h3><div class="crew-grid">'+crewChips+'</div></div>'+
        '<div class="card"><h3>Stock</h3>'+catsHtml+'</div>'+
        '<div class="card"><h3>Today\'s sales</h3><div class="table-wrap"><table class="plain"><thead><tr><th>Crew</th><th>Items</th><th>Total</th><th></th></tr></thead><tbody>'+todayHtml+'</tbody></table></div></div>'+
      '</div>'+
      '<div class="cart-panel">'+
        '<h3>Current sale</h3>'+
        (selectedCrew ? '<div style="font-size:14px;font-weight:600;margin-bottom:10px;">'+escapeHtml(selectedCrew.name)+'</div>' : '<div class="empty-note" style="color:#8E9AB3;">Select a crew member</div>')+
        (cartLines || '<div class="empty-note" style="color:#8E9AB3;">Cart is empty</div>')+
        '<div class="cart-total"><span class="label">Total</span><span class="amt">'+fmtMoney(total)+'</span></div>'+
        '<button class="btn btn-stamp btn-block" id="completeSaleBtn" '+(canComplete?'':'disabled')+'>Complete sale &amp; print receipt</button>'+
        (cartEntries.length ? '<button class="btn btn-outline btn-block" id="clearCartBtn">Clear cart</button>' : '')+
      '</div>'+
    '</div>';
  }

  function renderCrew(){
    var rows = state.crew.map(function(c){
      return '<tr><td>'+escapeHtml(c.name)+'</td>'+
        '<td class="row-actions"><button class="icon-btn" data-del-crew="'+c.id+'">Remove</button></td></tr>';

      '<h3>Crew list</h3>'+
      '<div class="table-wrap"><table class="plain"><thead><tr><th>Name</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+

  function soldThisPeriodByItem(){
    var pk = periodKeyForDate(new Date());
    var sold = {};
    (state.monthTxns[pk] || []).forEach(function(t){
      t.items.forEach(function(i){
        sold[i.itemId] = (sold[i.itemId] || 0) + i.qty;
      });
    });
    return sold;
  }

  function renderItems(){
    var sold = soldThisPeriodByItem();
    var totalValue = 0;
    var rows = state.catalog.map(function(it){
      var opening = it.openingStock || 0;
      var soldQty = sold[it.id] || 0;
      var remaining = opening - soldQty;
      totalValue += remaining * it.price;
      return '<tr><td>'+escapeHtml(it.category)+'</td><td>'+escapeHtml(it.name)+'</td>'+
        '<td class="month-total">'+fmtMoney(it.price)+'</td>'+
        '<td><input type="number" class="stock-input" min="0" step="1" value="'+opening+'" data-stock="'+it.id+'"></td>'+
        '<td class="month-total">'+soldQty+'</td>'+
        '<td class="month-total">'+remaining+'</td>'+
        '<td class="row-actions"><button class="icon-btn" data-del-item="'+it.id+'">Remove</button></td></tr>';
    }).join('');
    if(!state.catalog.length) rows = '<tr><td colspan="7" class="empty-note">No items yet.</td></tr>';
    return ''+
    '<h2 class="page-title">Inventory</h2>'+
    '<p class="page-sub">Set the opening stock for the start of the period. Sold and remaining update automatically as sales come in from the Sell tab.</p>'+
    '<div class="card">'+
      '<h3>Stock</h3>'+
      '<div class="table-wrap"><table class="plain"><thead><tr><th>Category</th><th>Item</th><th>Price</th><th>Opening stock</th><th>Sold</th><th>Remaining</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="add-row">'+
        '<input type="text" id="newItemCat" placeholder="Category (e.g. Cigarettes)" style="max-width:170px;">'+
        '<input type="text" id="newItemName" placeholder="Item name">'+
        '<input type="number" id="newItemPrice" placeholder="Price" min="0" step="0.01" style="max-width:100px;">'+
        '<button class="btn btn-teal" id="addItemBtn">Add item</button>'+
      '</div>'+
    '</div>'+
    '<div class="grand-total-card"><span class="label">Total inventory value (remaining stock)</span><span class="amt">'+fmtMoney(totalValue)+'</span></div>';
  }

  function renderReports(){
    var mk = state.viewMonth;
    var txns = state.monthTxns[mk] || [];
    var byCrew = {};
    txns.forEach(function(t){
      byCrew[t.crewId] = byCrew[t.crewId] || {name:t.crewName, total:0, count:0};
      byCrew[t.crewId].total += t.total;
      byCrew[t.crewId].count += 1;
    });
    var grand = txns.reduce(function(s,t){return s+t.total;},0);

    var rows = Object.keys(byCrew).sort(function(a,b){return byCrew[b].total-byCrew[a].total;}).map(function(id){
      var c = byCrew[id];
      return '<tr><td>'+escapeHtml(c.name)+'</td><td>'+c.count+'</td><td class="month-total">'+fmtMoney(c.total)+'</td></tr>';
    }).join('');
    if(!Object.keys(byCrew).length) rows = '<tr><td colspan="3" class="empty-note">No sales recorded for this month.</td></tr>';

    // Itemized breakdown: for each crew, what they bought this period, quantities and line totals.
    var byCrewItems = {};
    txns.forEach(function(t){
      byCrewItems[t.crewId] = byCrewItems[t.crewId] || {name:t.crewName, items:{}, total:0};
      var entry = byCrewItems[t.crewId];
      entry.total += t.total;
      t.items.forEach(function(i){
        entry.items[i.itemId] = entry.items[i.itemId] || {name:i.name, qty:0, amount:0};
        entry.items[i.itemId].qty += i.qty;
        entry.items[i.itemId].amount += i.price * i.qty;
      });
    });
    var crewIds = Object.keys(byCrewItems).sort(function(a,b){return byCrewItems[b].total-byCrewItems[a].total;});
    var crewStatementsHtml = crewIds.map(function(id){
      var c = byCrewItems[id];
      var itemRows = Object.keys(c.items).map(function(iid){
        var it = c.items[iid];
        return '<tr><td>'+escapeHtml(it.name)+'</td><td>'+it.qty+'</td><td class="month-total">'+fmtMoney(it.amount)+'</td></tr>';
      }).join('');
      return '<div class="crew-statement" data-crew-statement="'+id+'">'+
        '<div class="crew-statement-head"><h4>'+escapeHtml(c.name)+'</h4>'+
          '<button class="icon-btn no-print" data-print-crew="'+id+'">Print this statement</button></div>'+
        '<div class="table-wrap"><table class="plain"><thead><tr><th>Item</th><th>Qty</th><th>Amount</th></tr></thead><tbody>'+itemRows+'</tbody></table></div>'+
        '<div class="crew-statement-total"><span>Subtotal — '+escapeHtml(c.name)+'</span><span>'+fmtMoney(c.total)+'</span></div>'+
      '</div>';
    }).join('');
    if(!crewIds.length) crewStatementsHtml = '<div class="empty-note">No sales recorded for this period.</div>';

    var txnRows = txns.slice().reverse().map(function(t){
      var d = new Date(t.dateISO);
      return '<tr><td>'+d.toLocaleDateString()+'</td><td>'+escapeHtml(t.crewName)+'</td><td>'+t.items.length+'</td>'+
        '<td class="month-total">'+fmtMoney(t.total)+'</td>'+
        '<td class="row-actions"><button class="icon-btn" data-view-receipt="'+t.id+'">Receipt</button></td></tr>';
    }).join('');
    if(!txns.length) txnRows = '<tr><td colspan="5" class="empty-note">Nothing here yet.</td></tr>';

    var now = new Date();
    var monthOptions = [];
    for(var i=0;i<12;i++){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      var mkey = monthKey(d);
      monthOptions.push('<option value="'+mkey+'"'+(mkey===mk?' selected':'')+'>'+periodLabel(mkey)+'</option>');
    }

    var cutoffMonthOptions = [];
    for(var j=-6;j<=3;j++){
      var cd = new Date(now.getFullYear(), now.getMonth()+j, 1);
      var cmk = monthKey(cd);
      cutoffMonthOptions.push('<option value="'+cmk+'"'+(cmk===state.cutoffEditMonth?' selected':'')+'>'+cd.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</option>');
    }
    var hasOverride = state.settings.periodCutoffs && state.settings.periodCutoffs[state.cutoffEditMonth] != null;
    var effectiveCutoff = getCutoffForMonth(state.cutoffEditMonth);
    var defaultCutoff = state.settings.defaultCutoffDay || 1;

    return ''+
    '<h2 class="page-title">Report</h2>'+
    '<p class="page-sub">Per-crew totals for payroll deduction. Pick a period, then print or hand this over to payroll.</p>'+
    '<div class="card">'+
      '<h3>Cut-off day by month</h3>'+
      '<p class="settings-note" style="margin:0 0 14px;">Pick a calendar month, set the day it closes for salary-deduction prep, and save. Each month can have its own cut-off — sales made after that day roll into next month\'s report.</p>'+
      '<div class="add-row">'+
        '<select id="cutoffMonthSelect">'+cutoffMonthOptions.join('')+'</select>'+
        '<input type="number" id="cutoffDayInput" min="1" max="28" value="'+effectiveCutoff+'" style="max-width:90px;">'+
        '<button class="btn btn-outline" id="saveCutoffBtn">Save for this month</button>'+
        (hasOverride ? '<button class="btn btn-outline" id="clearCutoffBtn">Use default</button>' : '')+
      '</div>'+
      '<p class="settings-note">'+(hasOverride ? 'This month has its own cut-off (day '+effectiveCutoff+').' : 'This month is using the default cut-off (day '+defaultCutoff+').')+'</p>'+
      '<div class="add-row" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);">'+
        '<label style="font-size:13px;color:var(--grey);">Default cut-off (for months without their own setting)</label>'+
        '<input type="number" id="defaultCutoffInput" min="1" max="28" value="'+defaultCutoff+'" style="max-width:90px;">'+
        '<button class="btn btn-outline" id="saveDefaultCutoffBtn">Save default</button>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">'+
      '<label style="font-size:13px;color:var(--grey);">Period</label>'+
      '<select id="monthSelect">'+monthOptions.join('')+'</select>'+
      '<button class="btn btn-outline" id="printReportBtn" style="margin-left:auto;">Print report</button>'+
    '</div>'+
    '<div class="grand-total-card"><span class="label">Total to deduct — '+periodLabel(mk)+'</span><span class="amt">'+fmtMoney(grand)+'</span></div>'+
    '<div class="card" id="reportPrintArea">'+
      '<div id="crewSummaryTable">'+
        '<h3>Deduction by crew member</h3>'+
        '<div class="table-wrap"><table class="plain"><thead><tr><th>Crew</th><th>Purchases</th><th>Amount</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '</div>'+
      '<div class="itemized-breakdown" style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft);">'+
        '<h3>Itemized purchases by crew — '+periodLabel(mk)+'</h3>'+
        crewStatementsHtml+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<h3>All transactions this month</h3>'+
      '<div class="table-wrap"><table class="plain"><thead><tr><th>Date</th><th>Crew</th><th>Items</th><th>Total</th><th></th></tr></thead><tbody>'+txnRows+'</tbody></table></div>'+
    '</div>';
  }

  function bindTabEvents(){
    var main = document.getElementById('main');

    var crewSelect = document.getElementById('crewSelect');
    if(crewSelect) crewSelect.addEventListener('change', function(){
      state.selectedCrewId = crewSelect.value || null;
      render();
    });
    main.querySelectorAll('[data-plus]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.dataset.plus;
        state.cart[id] = (state.cart[id]||0)+1;
        render();
      });
    });
    main.querySelectorAll('[data-minus]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.dataset.minus;
        state.cart[id] = Math.max(0,(state.cart[id]||0)-1);
        render();
      });
    });
    var completeBtn = document.getElementById('completeSaleBtn');
    if(completeBtn) completeBtn.addEventListener('click', completeSale);
    var clearBtn = document.getElementById('clearCartBtn');
    if(clearBtn) clearBtn.addEventListener('click', function(){ state.cart = {}; render(); });

    main.querySelectorAll('[data-view-receipt]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.dataset.viewReceipt;
        var all = [].concat.apply([], Object.values(state.monthTxns));
        var t = all.find(function(x){return x.id===id;});
        if(t) showReceipt(t);
      });
    });
    main.querySelectorAll('[data-void]').forEach(function(el){
      el.addEventListener('click', function(){
        voidTxn(el.dataset.void);
      });
    });

    var addCrewBtn = document.getElementById('addCrewBtn');
    if(addCrewBtn) addCrewBtn.addEventListener('click', addCrew);
    var crewInput = document.getElementById('newCrewName');
    if(crewInput) crewInput.addEventListener('keydown', function(e){ if(e.key==='Enter') addCrew(); });
    main.querySelectorAll('[data-del-crew]').forEach(function(el){
      el.addEventListener('click', function(){ removeCrew(el.dataset.delCrew); });
    });

    var addItemBtn = document.getElementById('addItemBtn');
    if(addItemBtn) addItemBtn.addEventListener('click', addItem);
    main.querySelectorAll('[data-del-item]').forEach(function(el){
      el.addEventListener('click', function(){ removeItem(el.dataset.delItem); });
    });
    main.querySelectorAll('[data-stock]').forEach(function(el){
      el.addEventListener('change', function(){
        updateOpeningStock(el.dataset.stock, el.value);
      });
    });

    var declareCrewSelect = document.getElementById('declareCrewSelect');
    if(declareCrewSelect) declareCrewSelect.addEventListener('change', function(){
      state.declareCrewId = declareCrewSelect.value || null;
      render();
    });
    main.querySelectorAll('[data-decl-plus]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.dataset.declPlus;
        state.declareCart[id] = (state.declareCart[id]||0)+1;
        render();
      });
    });
    main.querySelectorAll('[data-decl-minus]').forEach(function(el){
      el.addEventListener('click', function(){
        var id = el.dataset.declMinus;
        state.declareCart[id] = Math.max(0,(state.declareCart[id]||0)-1);
        render();
      });
    });
    var saveDeclBtn = document.getElementById('saveDeclBtn');
    if(saveDeclBtn) saveDeclBtn.addEventListener('click', saveDeclaration);
    main.querySelectorAll('[data-del-decl]').forEach(function(el){
      el.addEventListener('click', function(){ removeDeclaration(el.dataset.delDecl); });
    });

    var monthSelect = document.getElementById('monthSelect');
    if(monthSelect) monthSelect.addEventListener('change', async function(){
      state.viewMonth = monthSelect.value;
      await ensureMonthLoaded(state.viewMonth);
      render();
    });
    var printReportBtn = document.getElementById('printReportBtn');
    if(printReportBtn) printReportBtn.addEventListener('click', function(){ printFullReport(); });
    main.querySelectorAll('[data-print-crew]').forEach(function(el){
      el.addEventListener('click', function(){ printSingleCrewStatement(el.dataset.printCrew); });
    });

    var saveCutoffBtn = document.getElementById('saveCutoffBtn');
    if(saveCutoffBtn) saveCutoffBtn.addEventListener('click', saveCutoffForMonth);
    var clearCutoffBtn = document.getElementById('clearCutoffBtn');
    if(clearCutoffBtn) clearCutoffBtn.addEventListener('click', clearCutoffForMonth);
    var saveDefaultCutoffBtn = document.getElementById('saveDefaultCutoffBtn');
    if(saveDefaultCutoffBtn) saveDefaultCutoffBtn.addEventListener('click', saveDefaultCutoff);
    var cutoffMonthSelect = document.getElementById('cutoffMonthSelect');
    if(cutoffMonthSelect) cutoffMonthSelect.addEventListener('change', function(){
      state.cutoffEditMonth = cutoffMonthSelect.value;
      render();
    });
  }

  function printFullReport(){
    document.body.classList.add('printing-report');
    window.print();
    var cleanup = function(){
      document.body.classList.remove('printing-report');
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(cleanup, 2000);
  }

  function printSingleCrewStatement(crewId){
    var container = document.getElementById('reportPrintArea');
    if(!container) return;
    var summary = document.getElementById('crewSummaryTable');
    var statements = container.querySelectorAll('[data-crew-statement]');
    if(summary) summary.style.display = 'none';
    statements.forEach(function(el){
      el.style.display = (el.dataset.crewStatement === crewId) ? '' : 'none';
    });
    document.body.classList.add('printing-report');
    window.print();
    var cleanup = function(){
      if(summary) summary.style.display = '';
      statements.forEach(function(el){ el.style.display = ''; });
      document.body.classList.remove('printing-report');
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    setTimeout(cleanup, 2000);
  }

  async function updateOpeningStock(itemId, rawVal){
    var val = parseInt(rawVal, 10);
    if(isNaN(val) || val < 0) val = 0;
    var it = state.catalog.find(function(x){return x.id===itemId;});
    if(it){
      it.openingStock = val;
      await storageSet('catalog', state.catalog);
    }
    render();
  }

  async function saveCutoffForMonth(){
    var input = document.getElementById('cutoffDayInput');
    var val = parseInt(input.value, 10);
    if(isNaN(val) || val < 1) val = 1;
    if(val > 28) val = 28;
    state.settings.periodCutoffs = state.settings.periodCutoffs || {};
    state.settings.periodCutoffs[state.cutoffEditMonth] = val;
    await storageSet('settings', state.settings);
    state.viewMonth = periodKeyForDate(new Date());
    await ensureMonthLoaded(state.viewMonth);
    render();
  }

  async function clearCutoffForMonth(){
    if(state.settings.periodCutoffs) delete state.settings.periodCutoffs[state.cutoffEditMonth];
    await storageSet('settings', state.settings);
    state.viewMonth = periodKeyForDate(new Date());
    await ensureMonthLoaded(state.viewMonth);
    render();
  }

  async function saveDefaultCutoff(){
    var input = document.getElementById('defaultCutoffInput');
    var val = parseInt(input.value, 10);
    if(isNaN(val) || val < 1) val = 1;
    if(val > 28) val = 28;
    state.settings.defaultCutoffDay = val;
    await storageSet('settings', state.settings);
    state.viewMonth = periodKeyForDate(new Date());
    await ensureMonthLoaded(state.viewMonth);
    render();
  }

  async function addCrew(){
    var input = document.getElementById('newCrewName');
    var name = input.value.trim();
    if(!name) return;
    state.crew.push({id:uid(), name:name});
    await storageSet('crew', state.crew);
    render();
  }
  async function removeCrew(id){
    state.crew = state.crew.filter(function(c){return c.id!==id;});
    if(state.selectedCrewId===id) state.selectedCrewId=null;
    await storageSet('crew', state.crew);
    render();
  }
  async function addItem(){
    var cat = document.getElementById('newItemCat').value.trim() || 'Other';
    var name = document.getElementById('newItemName').value.trim();
    var price = parseFloat(document.getElementById('newItemPrice').value);
    if(!name || isNaN(price) || price<0) return;
    state.catalog.push({id:uid(), category:cat, name:name, price:price, openingStock:0});
    await storageSet('catalog', state.catalog);
    render();
  }
  async function removeItem(id){
    state.catalog = state.catalog.filter(function(it){return it.id!==id;});
    delete state.cart[id];
    await storageSet('catalog', state.catalog);
    render();
  }

  var receiptCounter = null;
  async function nextReceiptNo(){
    if(receiptCounter===null){
      receiptCounter = await storageGet('receipt-counter', 0);
    }
    receiptCounter += 1;
    await storageSet('receipt-counter', receiptCounter);
    return receiptCounter;
  }

  async function completeSale(){
    var crew = state.crew.find(function(c){return c.id===state.selectedCrewId;});
    if(!crew) return;
    var cartEntries = Object.keys(state.cart).filter(function(id){return state.cart[id]>0;});
    if(!cartEntries.length) return;

    var items = cartEntries.map(function(id){
      var it = state.catalog.find(function(x){return x.id===id;});
      return {itemId:id, name:it.name, price:it.price, qty:state.cart[id]};
    });
    var total = items.reduce(function(s,i){return s+i.price*i.qty;},0);
    var no = await nextReceiptNo();
    var txn = {
      id: uid(),
      receiptNo: no,
      crewId: crew.id,
      crewName: crew.name,
      dateISO: new Date().toISOString(),
      items: items,
      total: total
    };
    var mk = periodKeyForDate(new Date());
    state.monthTxns[mk] = state.monthTxns[mk] || [];
    state.monthTxns[mk].push(txn);
    await storageSet('txns:' + mk, state.monthTxns[mk]);

    state.cart = {};
    state.selectedCrewId = null;
    render();
    showReceipt(txn);
  }

  async function voidTxn(txnId){
    if(!confirm('Void this sale? This removes it from the record.')) return;
    var mk = periodKeyForDate(new Date());
    state.monthTxns[mk] = (state.monthTxns[mk]||[]).filter(function(t){return t.id!==txnId;});
    await storageSet('txns:' + mk, state.monthTxns[mk]);
    render();
  }

  async function saveDeclaration(){
    var crew = state.crew.find(function(c){return c.id===state.declareCrewId;});
    if(!crew) return;
    var cartEntries = Object.keys(state.declareCart).filter(function(id){return state.declareCart[id]>0;});
    if(!cartEntries.length) return;

    var items = cartEntries.map(function(id){
      var it = state.catalog.find(function(x){return x.id===id;});
      return {itemId:id, name:it.name, qty:state.declareCart[id]};
    });
    var pk = periodKeyForDate(new Date());
    var dcl = {
      id: uid(),
      crewId: crew.id,
      crewName: crew.name,
      dateISO: new Date().toISOString(),
      items: items
    };
    state.declarations[pk] = state.declarations[pk] || [];
    state.declarations[pk].push(dcl);
    await storageSet('decl:' + pk, state.declarations[pk]);

    state.declareCart = {};
    state.declareCrewId = null;
    render();
  }

  async function removeDeclaration(id){
    if(!confirm('Remove this declaration? This does not affect inventory or payroll.')) return;
    var pk = periodKeyForDate(new Date());
    state.declarations[pk] = (state.declarations[pk]||[]).filter(function(d){return d.id!==id;});
    await storageSet('decl:' + pk, state.declarations[pk]);
    render();
  }

  function showReceipt(txn){
    state.lastReceipt = txn;
    var d = new Date(txn.dateISO);
    var itemsHtml = txn.items.map(function(i){
      return '<div class="r-item-row"><span class="r-item-name">'+escapeHtml(i.name)+' x'+i.qty+'</span><span>'+fmtMoney(i.price*i.qty)+'</span></div>';
    }).join('');
    var html = ''+
      '<div class="r-center"><span class="r-stamp">BONDED STORE</span></div>'+
      '<p class="r-sub r-center">crew purchase receipt</p>'+
      '<div class="r-dash"></div>'+
      '<div class="r-row"><span>Receipt</span><span>#'+String(txn.receiptNo).padStart(4,'0')+'</span></div>'+
      '<div class="r-row"><span>Crew</span><span>'+escapeHtml(txn.crewName)+'</span></div>'+
      '<div class="r-row muted"><span>Date</span><span>'+d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span></div>'+
      '<div class="r-dash"></div>'+
      itemsHtml+
      '<div class="r-dash"></div>'+
      '<div class="r-total-row"><span>Total</span><span>'+fmtMoney(txn.total)+'</span></div>'+
      '<p class="r-foot">Deducted from salary at month end.<br>Keep this copy for your records.</p>';
    document.getElementById('receiptSlip').innerHTML = html;
    document.getElementById('receiptOverlay').classList.add('show');
  }
  document.getElementById('closeReceiptBtn').addEventListener('click', function(){
    document.getElementById('receiptOverlay').classList.remove('show');
  });
  document.getElementById('printReceiptBtn').addEventListener('click', function(){
    window.print();
  });
  document.getElementById('receiptOverlay').addEventListener('click', function(e){
    if(e.target.id === 'receiptOverlay') document.getElementById('receiptOverlay').classList.remove('show');
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.error('Service worker registration failed', err);
      });
    });
  }

  loadAll();
})();
</script>

</body>
</html>
